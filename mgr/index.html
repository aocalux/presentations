<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Presentation Manager</title>

    <style>
        :root {
            color-scheme: dark;

            --background: #171519;
            --surface: #211e23;
            --border: #363039;

            --text: #eee9ef;
            --muted: #a49aa5;

            --pink: #d45a9f;
            --pink-light: #392432;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 55px 30px;

            background: var(--background);
            color: var(--text);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            font-size: 15px;
            line-height: 1.5;
        }

        main {
            max-width: 1050px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 35px;
        }

        h1 {
            margin: 0 0 5px;
            font-size: 1.8rem;
            font-weight: 650;
            letter-spacing: -0.04em;
        }

        header p {
            margin: 0;
            color: var(--muted);
        }

        .search {
            display: block;
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 24px;

            border: 1px solid var(--border);
            border-radius: 6px;

            background: var(--surface);
            color: var(--text);

            font: inherit;
            outline: none;
        }

        .search:focus {
            border-color: var(--pink);
        }

        .search::placeholder {
            color: var(--muted);
        }

        .meta {
            display: flex;
            justify-content: space-between;

            margin-bottom: 12px;

            color: var(--muted);
            font-size: 0.85rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill,
                    minmax(240px, 1fr));
            gap: 12px;
        }

        .card {
            display: block;
            padding: 16px;

            border: 1px solid var(--border);
            border-radius: 6px;

            background: var(--surface);
            color: var(--text);

            text-decoration: none;
        }

        .card:hover {
            border-color: var(--pink);
            background: var(--pink-light);
        }

        .card h2 {
            margin: 0 0 5px;
            font-size: 1rem;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .card .folder {
            margin-bottom: 7px;
            color: var(--pink);
            font-size: 0.8rem;
        }

        .card .path {
            color: var(--muted);
            font-size: 0.78rem;
            overflow-wrap: anywhere;
        }

        .status {
            padding: 25px 0;
            color: var(--muted);
            text-align: center;
        }

        .error {
            color: #ed8292;
        }
    </style>

</head>

<body>
    <main>

        <header>
            <h1>Presentation Manager</h1>
            <p>Presentation overview</p>
        </header>

        <input class="search" type="search" id="search" placeholder="Search for presentation ..."
            aria-label="Search for presentation">

        <div class="meta">
            <span id="count">loading ...</span>
            <span id="repository"></span>
        </div>

        <section class="grid" id="presentations"></section>

        <div class="status" id="status">
            searching ...
        </div>



    </main>

    <script>
        // Configuration

        const CONFIG = {
            owner: "aocalux",
            repo: "presentations",
            branch: "main",

            pagesBaseUrl:
                "https://aocalux.github.io/presentations/"
        };

        let presentations = [];

        const container = document.getElementById("presentations");
        const status = document.getElementById("status");
        const count = document.getElementById("count");

        document.getElementById("repository").textContent =
            `Github-repo: ${CONFIG.owner}/${CONFIG.repo}`;


        // Fetch repository contents

        async function loadPresentations() {
            try {
                const apiUrl =
                    `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/git/trees/${CONFIG.branch}?recursive=1`;

                const response = await fetch(apiUrl);

                if (!response.ok) {
                    throw new Error(`GitHub API: ${response.status}`);
                }

                const data = await response.json();

                if (data.truncated) {
                    throw new Error("Repository structure is too large.");
                }

                presentations = data.tree
                    .filter(file =>
                        file.type === "blob" &&
                        file.path.endsWith("/index.html")
                    )
                    .map(file => {
                        const folderPath = file.path.substring(
                            0,
                            file.path.lastIndexOf("/")
                        );

                        const parts = folderPath.split("/");

                        return {
                            name: parts[parts.length - 1],
                            folder: parts.length > 1
                                ? parts.slice(0, -1).join(" / ")
                                : "ROOT",
                            path: folderPath,
                            url: CONFIG.pagesBaseUrl +
                                folderPath.split("/")
                                    .map(encodeURIComponent)
                                    .join("/") +
                                "/"
                        };
                    })
                    .sort((a, b) =>
                        a.path.localeCompare(b.path, "en")
                    );

                renderPresentations();

                if (presentations.length === 0) {
                    status.textContent = "No presentations found :(.";
                }

            } catch (error) {
                console.error(error);

                status.textContent =
                    "Error: " + error.message;

                status.classList.add("error");
            }
        }


        // Render presentation cards

        function renderPresentations(filter = "") {
            container.innerHTML = "";

            const filtered = presentations.filter(item => {
                const searchable =
                    `${item.name} ${item.folder} ${item.path}`;

                return searchable
                    .toLowerCase()
                    .includes(filter.toLowerCase());
            });

            count.textContent =
                `${filtered.length} of ${presentations.length} Presentations`;

            filtered.forEach(item => {
                const card = document.createElement("a");

                card.className = "card";
                card.href = item.url;
                card.target = "_blank";
                card.rel = "noopener noreferrer";

                const title = document.createElement("h2");
                title.textContent = item.name;

                const folder = document.createElement("div");
                folder.className = "folder";
                folder.textContent = item.folder;

                const path = document.createElement("div");
                path.className = "path";
                path.textContent = item.path + "/index.html";

                card.append(title, folder, path);
                container.appendChild(card);
            });

            status.textContent = filtered.length === 0
                ? "no match."
                : "";
        }


        // Search

        document.getElementById("search")
            .addEventListener("input", event => {
                renderPresentations(event.target.value);
            });


        // Initialize

        loadPresentations();

    </script>
</body>

</html>
